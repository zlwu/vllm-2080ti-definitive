name: Image

# The image is only rebuilt when something upstream actually moved:
#
#   * the pinned CUDA base image digests (devel = builder, base = runtime)
#   * a new stable release of weicj/vLLM-2080Ti-Definitive on the same release
#     line as the pinned one (v0.2.2 -> v0.2.2-post2): this builds directly and
#     records the new ref in .github/vllm-ref afterwards
#   * a new stable release on a different minor/major line (v0.2.x -> v0.3.0):
#     this opens a pull request instead, because it is a runtime migration
#   * a change to the build recipe in this repository
#
# There is deliberately no "rebuild on every push / every week" behaviour: a
# full build compiles vLLM from source, so the scheduled job is a *check* that
# only escalates to a build when a base digest or the upstream ref moved.
#
# `.github/vllm-ref` is the recorded last-built upstream release, not a
# hand-maintained gate: the workflow updates it after a successful push. Every
# image also carries that ref as a tag (`v0.2.2-post2`) and as the label
# `io.github.zlwu.upstream-ref`, so a running deployment can be traced back to
# the upstream tag without reading the Actions log.

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'relax-flashqla-build-guard.py'
      - '.github/cuda-base'
      - '.github/vllm-ref'
      - '.github/workflows/image.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      vllm_ref:
        description: 'Override the pinned upstream release tag (empty = keep .github/vllm-ref)'
        required: false
        default: ''
      max_jobs:
        description: 'Compiler parallelism; lower it if the runner runs out of memory'
        required: false
        default: '4'
  schedule:
    # Poll for new CUDA base images and upstream releases. A same-line release
    # builds straight away; a different release line opens a pull request.
    - cron: '23 0 * * *'

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  UPSTREAM_REPO: weicj/vLLM-2080Ti-Definitive
  BOT_BRANCH: automation/upstream-sync

jobs:
  # Cheap pull-request gate: builds only the toolchain stage (minutes) instead
  # of the hours-long runtime build.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Validate shell script and Dockerfile toolchain
        run: |
          shellcheck entrypoint.sh
          docker build --target toolchain -f Dockerfile .

      - name: Check for committed secrets or real infrastructure data
        run: |
          test -z "$(git ls-files | grep -E '(^|/)(\.env|.*\.secret|.*\.pem|.*\.key)$' || true)"
          if git grep -nIE '192\.168\.|BEGIN [A-Z ]*PRIVATE KEY' -- . ; then
            echo 'Found host addresses or private keys in tracked files.' >&2
            exit 1
          fi

  detect:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      cuda_devel: ${{ steps.decide.outputs.cuda_devel }}
      cuda_runtime: ${{ steps.decide.outputs.cuda_runtime }}
      base_changed: ${{ steps.decide.outputs.base_changed }}
      vllm_ref: ${{ steps.decide.outputs.vllm_ref }}
      bump: ${{ steps.upstream.outputs.bump }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve upstream state
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # .github/cuda-base holds one pinned ref per line: devel, then base.
          mapfile -t pinned < <(grep -v '^\s*$' .github/cuda-base)
          echo "pinned_devel=${pinned[0]}" >> "$GITHUB_OUTPUT"
          echo "pinned_runtime=${pinned[1]}" >> "$GITHUB_OUTPUT"

          devel_digest=$(docker buildx imagetools inspect nvidia/cuda:13.0.3-devel-ubuntu24.04 \
            --format '{{.Manifest.Digest}}')
          runtime_digest=$(docker buildx imagetools inspect nvidia/cuda:13.0.3-base-ubuntu24.04 \
            --format '{{.Manifest.Digest}}')
          echo "devel=nvidia/cuda:13.0.3-devel-ubuntu24.04@${devel_digest}" >> "$GITHUB_OUTPUT"
          echo "runtime=nvidia/cuda:13.0.3-base-ubuntu24.04@${runtime_digest}" >> "$GITHUB_OUTPUT"

          echo "pinned_ref=$(tr -d '[:space:]' < .github/vllm-ref)" >> "$GITHUB_OUTPUT"
          latest_ref=$(gh api "repos/${UPSTREAM_REPO}/releases" --paginate \
            --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name')
          case "$latest_ref" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid upstream release tag: $latest_ref" >&2; exit 1 ;;
          esac
          echo "latest_ref=${latest_ref}" >> "$GITHUB_OUTPUT"

          # auto   = same release line, built without a human in the loop
          # review = different line, proposed as a pull request
          # none   = the recorded ref is already the latest stable release
          pinned_ref=$(tr -d '[:space:]' < .github/vllm-ref)
          case "$pinned_ref" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid recorded upstream ref: ${pinned_ref}" >&2; exit 1 ;;
          esac
          if [ "$latest_ref" = "$pinned_ref" ]; then
            bump=none
          elif [ "$(echo "$latest_ref" | cut -d. -f1-2)" = "$(echo "$pinned_ref" | cut -d. -f1-2)" ]; then
            bump=auto
          else
            bump=review
          fi
          echo "bump=${bump}" >> "$GITHUB_OUTPUT"

          echo "Resolved CUDA devel digest:  ${devel_digest}"
          echo "Resolved CUDA runtime digest: ${runtime_digest}"
          echo "Recorded vLLM release: ${pinned_ref}, latest: ${latest_ref}, action: ${bump}"

      - name: Propose upstream release bump
        if: github.event_name == 'schedule' && steps.upstream.outputs.bump == 'review'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REF: ${{ steps.upstream.outputs.latest_ref }}
          PREVIOUS_REF: ${{ steps.upstream.outputs.pinned_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BOT_BRANCH"
          printf '%s\n' "$TARGET_REF" > .github/vllm-ref
          git add .github/vllm-ref
          git commit -m "Pin vLLM 2080 Ti Definitive to ${TARGET_REF}"
          git push --force origin "$BOT_BRANCH"
          body=$(printf '%s\n' \
            "Upstream released \`${TARGET_REF}\` (currently pinned: \`${PREVIOUS_REF}\`)." \
            "" \
            "Merging this bumps \`.github/vllm-ref\` and triggers the image build," \
            "which recompiles vLLM from that tag. Check the release notes for SM75" \
            "route, profile-name and correctness changes before merging, and note" \
            "that profile filenames have changed between releases." )
          gh pr create --base main --head "$BOT_BRANCH" \
            --title "Pin vLLM 2080 Ti Definitive to ${TARGET_REF}" \
            --body "$body" \
            || gh pr comment "$BOT_BRANCH" --body "$body"

      - name: Decide whether to build
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          OVERRIDE_REF: ${{ inputs.vllm_ref }}
          DEVEL: ${{ steps.upstream.outputs.devel }}
          RUNTIME: ${{ steps.upstream.outputs.runtime }}
          PINNED_DEVEL: ${{ steps.upstream.outputs.pinned_devel }}
          PINNED_RUNTIME: ${{ steps.upstream.outputs.pinned_runtime }}
          PINNED_REF: ${{ steps.upstream.outputs.pinned_ref }}
          LATEST_REF: ${{ steps.upstream.outputs.latest_ref }}
          BUMP: ${{ steps.upstream.outputs.bump }}
        run: |
          set -euo pipefail
          build=false
          base_changed=false
          vllm_ref="$PINNED_REF"

          if [ "$DEVEL" != "$PINNED_DEVEL" ] || [ "$RUNTIME" != "$PINNED_RUNTIME" ]; then
            base_changed=true
          fi

          case "$EVENT" in
            push)
              build=true
              ;;
            workflow_dispatch)
              build=true
              [ -n "$OVERRIDE_REF" ] && vllm_ref="$OVERRIDE_REF"
              ;;
            schedule)
              if [ "$base_changed" = true ]; then
                echo "CUDA base moved, will rebuild"
                build=true
              else
                echo "CUDA bases unchanged"
              fi
              case "$BUMP" in
                none)
                  echo "recorded ref is already the latest stable release (${LATEST_REF})"
                  ;;
                auto)
                  echo "same release line: building ${LATEST_REF}"
                  build=true
                  vllm_ref="$LATEST_REF"
                  ;;
                review)
                  echo "${LATEST_REF} changes the release line; pull request opened, not building"
                  ;;
              esac
              ;;
          esac

          {
            echo "build=${build}"
            echo "cuda_devel=${DEVEL}"
            echo "cuda_runtime=${RUNTIME}"
            echo "base_changed=${base_changed}"
            echo "vllm_ref=${vllm_ref}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.build == 'true'
    runs-on: ubuntu-latest
    # GitHub kills a job at 360 minutes; keep headroom so a slow first build
    # fails cleanly instead of being cancelled mid-export.
    timeout-minutes: 355
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.detect.outputs.vllm_ref }}
            type=ref,event=tag
            type=sha,format=long
          labels: |
            io.github.zlwu.upstream-ref=${{ needs.detect.outputs.vllm_ref }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Standalone vLLM 2080 Ti Definitive Edition (SM75) runtime
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.base.digest=${{ needs.detect.outputs.cuda_runtime }}

      # Registry cache, not actions/cache: the builder stage is tens of
      # gigabytes and would blow the 10 GB GitHub Actions cache budget.
      # `mode=max` is required so the expensive runtime-builder stage is cached,
      # not just the final image layers.
      - name: Build and push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VLLM_REF=${{ needs.detect.outputs.vllm_ref }}
            CUDA_DEVEL_BASE=${{ needs.detect.outputs.cuda_devel }}
            CUDA_RUNTIME_BASE=${{ needs.detect.outputs.cuda_runtime }}
            MAX_JOBS=${{ inputs.max_jobs || '4' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: |
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max,oci-mediatypes=true,image-manifest=true

      # `.github/vllm-ref` is the recorded last-built upstream release. Writing
      # it after a successful push is what makes the scheduled check idempotent
      # without a human bumping the pin. This push uses GITHUB_TOKEN, so it does
      # not trigger another workflow run.
      - name: Record the built upstream ref
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          ref='${{ needs.detect.outputs.vllm_ref }}'
          case "$ref" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "not a release tag (${ref}); leaving the marker alone"; exit 0 ;;
          esac
          if [ "$(tr -d '[:space:]' < .github/vllm-ref)" = "$ref" ]; then
            echo ".github/vllm-ref already records ${ref}"
            exit 0
          fi
          printf '%s\n' "$ref" > .github/vllm-ref
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/vllm-ref
          git commit -m "Record built upstream ref ${ref}"
          git push origin HEAD:main || echo 'push failed; the ref will be re-detected next run'

      # Record the base digests only after the image published, so a failed
      # build leaves the pins untouched and the next check retries them.
      - name: Record the new base digests
        if: needs.detect.outputs.base_changed == 'true' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          printf '%s\n%s\n' \
            '${{ needs.detect.outputs.cuda_devel }}' \
            '${{ needs.detect.outputs.cuda_runtime }}' > .github/cuda-base
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/cuda-base
          git commit -m "Track CUDA base digests"
          git push origin HEAD:main || echo 'push failed; the digests will be re-detected next run'

      - name: Summary
        run: |
          {
            echo "### Image pushed"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "| input | value |"
            echo "| --- | --- |"
            echo "| upstream ref | \`${{ needs.detect.outputs.vllm_ref }}\` |"
            echo "| CUDA devel base | \`${{ needs.detect.outputs.cuda_devel }}\` |"
            echo "| CUDA runtime base | \`${{ needs.detect.outputs.cuda_runtime }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
